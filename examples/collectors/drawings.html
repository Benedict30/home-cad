<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flat Layout Plans</title>
<style>
:root{--bg:#f1efe9;--card:#ffffff;--ink:#1d1f23;--ink2:#5c6068;--line:#dcd8cf;--accent:#2b6be4;--best:#c2571a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--ink:#eceae5;--ink2:#a4a8b0;--line:#30343b;--accent:#7ea6ff;--best:#f08a4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--ink:#eceae5;--ink2:#a4a8b0;--line:#30343b;--accent:#7ea6ff;--best:#f08a4b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:clamp(24px,4vw,34px);line-height:1.15;margin:0 0 6px}
h2{font-size:20px;margin:28px 0 10px}
.sub{color:var(--ink2);margin:0 0 14px;max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#stage{position:relative;height:min(62vh,560px);border-radius:10px;overflow:hidden;background:#e9eef3;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:#4a5260;background:rgba(255,255,255,.8);padding:2px 8px;border-radius:6px}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.tools button{font:inherit;font-size:13px;border:1px solid #c9ced6;background:#fff;color:#1d1f23;border-radius:8px;padding:4px 10px;cursor:pointer}
.tools button.on{background:#2b6be4;border-color:#2b6be4;color:#fff}
.walking .cut{display:none}
.mini{position:absolute;right:10px;bottom:10px;width:min(36%,230px);background:#fbf9f4;border:1px solid #d6d0c4;border-radius:8px;overflow:hidden;display:none;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}
.walking .mini{display:block}
.walking .hint{max-width:calc(100% - min(36%,230px) - 30px)}
.mini svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:26px;height:0;border-top:5px solid #1d1f23}
.lay{margin-top:18px}
.lay h3{margin:0 0 4px;font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lay .tag{font-size:12px;font-weight:700;color:#fff;background:var(--best);border-radius:99px;padding:1px 9px}
.lay .ph{font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.lay p{margin:0 0 10px;color:var(--ink2)}
.pair{display:grid;grid-template-columns:1.05fr 1fr;gap:12px;align-items:start}
.paper{background:#fbf9f4;border-radius:10px;border:1px solid #e3ded2;overflow:hidden}
.paper svg{display:block;width:100%;height:auto}
.shot{background:#e9eef3;border-radius:10px;border:1px solid #d9dee5;overflow:hidden;aspect-ratio:4/3}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.no3d .shot,.no3d #viewer3d{display:none}
.no3d .pair{grid-template-columns:1fr}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
</style>
</head>

<main>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <section class="card" id="viewer3d">
    <div class="chips" id="chips"></div>
    <div id="stage"><canvas id="c3" aria-label="3D view of the selected layout"></canvas><div class="tools"><button id="walk" type="button">Walk</button><button class="cut" id="cut" type="button">Full-height walls</button></div><div class="hint" id="hint">Drag to turn · scroll or pinch to zoom</div><div class="mini" id="mini" title="Tap the plan to walk there"></div></div>
  </section>
  <h2>Wall key</h2>
  <div class="card">
    <div class="paper" id="key"></div>
    <div class="legend"><span><i></i>Must stay</span><span><i style="border-color:#1f9d55"></i>Can go, with HDB approval</span><span><i style="border-top-style:dashed;border-color:#1f9d55"></i>Removed</span><span><i style="border-top:2px dotted #8a8f98"></i>Open edge, no wall</span><span><i style="border-color:#2b6be4"></i>New wall</span><span><i style="border-top:3px solid #8ec5e8"></i>Window</span></div>
  </div>
  <h2>Layouts</h2>
  <div id="layouts"></div>
</main>
